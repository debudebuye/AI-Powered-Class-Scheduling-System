{% extends 'base_modern.html' %}

{% block title %}Welcome - AI Class Scheduling System{% endblock %}

{% block content %}
<section class="hero-section" style="padding: 5rem 0 4rem;">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-lg-5">
                <div class="text-center">
                    <div class="feature-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2rem;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="fw-bold mb-3" style="letter-spacing: -0.02em;">Welcome, {{ new_user.first_name }}!</h2>
                    <p class="text-muted mb-4" style="font-size: 1.05rem;">
                        Your account has been successfully created. You can now sign in to access the scheduling dashboard.
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="{% url 'account:login' %}" class="btn btn-modern btn-primary-modern" style="background: var(--gradient-ai); color: white;">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </a>
                        <a href="{% url 'schedule:index' %}" class="btn btn-modern btn-outline-modern" style="border: 2px solid var(--primary); color: var(--primary);">
                            <i class="fas fa-home"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
