<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="12"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="300"/><line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/><line x1="550" y1="0" x2="550" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/><line x1="650" y1="0" x2="650" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/><line x1="750" y1="0" x2="750" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/><line x1="850" y1="0" x2="850" y2="300"/>
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="780" cy="70" r="50" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.12"/>
  <circle cx="780" cy="70" r="80" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.08"/>
  <circle cx="830" cy="230" r="35" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <circle cx="80" cy="260" r="25" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.08"/>

  <!-- Brain Icon - scaled down and repositioned -->
  <g transform="translate(80, 75) scale(0.55)" filter="url(#glow)">
    <path d="M70 10 C50 10 35 20 30 35 C20 30 10 40 15 55 C5 60 5 80 20 90 C15 105 25 120 40 115 C45 130 65 135 80 125 C90 135 110 130 115 115 C130 120 140 105 135 90 C150 80 150 60 140 55 C145 40 135 30 125 35 C120 20 105 10 85 10 Z"
          fill="none" stroke="url(#brain)" stroke-width="2.5" opacity="0.9"/>
    <path d="M75 30 C75 50 65 65 75 85 C85 65 75 50 75 30" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.5"/>
    <path d="M60 50 C70 55 80 55 90 50" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <path d="M55 75 C65 70 85 70 95 75" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <circle cx="75" cy="45" r="3" fill="#818cf8" opacity="0.7"/>
    <circle cx="65" cy="70" r="2.5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="85" cy="65" r="2.5" fill="#c084fc" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="180" y="120" fill="#fff" font-size="36" font-weight="800" letter-spacing="-0.5">
    AI-Powered
  </text>
  <text x="180" y="162" fill="url(#accent)" font-size="36" font-weight="800" letter-spacing="-0.5">
    Class Scheduling System
  </text>

  <!-- Subtitle -->
  <text x="180" y="200" fill="#94a3b8" font-size="15" font-weight="400">
    Intelligent timetable generation using evolutionary AI algorithms
  </text>

  <!-- Tech badges -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="0.5"/>
    <text x="35" y="17" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Django</text>

    <rect x="80" y="0" width="62" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="111" y="17" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">Python</text>

    <rect x="152" y="0" width="110" height="26" rx="13" fill="#a78bfa" opacity="0.2" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="207" y="17" fill="#ddd6fe" font-size="11" font-weight="600" text-anchor="middle">Genetic Algorithm</text>

    <rect x="272" y="0" width="86" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="0.5"/>
    <text x="315" y="17" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <rect x="368" y="0" width="80" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="408" y="17" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">Docker</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="296" width="900" height="4" rx="0" fill="url(#accent)" opacity="0.6"/>
</svg>
