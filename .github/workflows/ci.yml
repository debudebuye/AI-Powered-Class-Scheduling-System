name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8 black isort
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 apps/ config/ --max-line-length=120

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: production
      SECRET_KEY: test-secret-key-must-be-at-least-fifty-characters-long-for-production
      ALLOWED_HOSTS: localhost
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-django pytest-cov factory-boy
      - run: python manage.py migrate
      - run: pytest --cov=apps --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-scheduling:${{ github.sha }} .
      - run: >
          docker run --rm
          -e DJANGO_ENV=production
          -e SECRET_KEY=ci-test-secret-key-must-be-at-least-fifty-characters-long-ok
          -e ALLOWED_HOSTS=localhost,127.0.0.1
          ai-scheduling:${{ github.sha }}
          python manage.py check --deploy --fail-level WARNING
