{% load l10n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        .redirect-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            max-width: 450px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #818cf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2 style="margin-bottom: 1rem;">Redirecting...</h2>
        <p style="opacity: 0.7;">
            If you are not redirected automatically, click <a id="redirect-link" href="#">here</a>.
        </p>
    </div>
    <script>
        var link = {{ mailto_link|json_script }};
        var url = JSON.parse(link);
        document.getElementById('redirect-link').href = url;
        window.onload = function() { window.location.href = url; };
    </script>
</body>
</html>
