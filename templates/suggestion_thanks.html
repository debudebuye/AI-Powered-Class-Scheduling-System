{% extends 'base_modern.html' %}

{% block title %}Thank You - AI Class Scheduling System{% endblock %}

{% block content %}
<section class="hero-section" style="padding: 5rem 0 4rem;">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-lg-5">
                <div class="text-center">
                    <div class="feature-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2rem;">
                        <i class="fas fa-heart"></i>
                    </div>
                    <h2 class="fw-bold mb-3" style="letter-spacing: -0.02em;">Thank You!</h2>
                    <p class="text-muted mb-4" style="font-size: 1.05rem;">
                        We appreciate your feedback. Your suggestion will help us improve the AI scheduling system.
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="{% url 'schedule:suggestion' %}" class="btn btn-modern btn-primary-modern" style="background: var(--gradient-ai); color: white;">
                            <i class="fas fa-plus"></i> Submit Another
                        </a>
                        <a href="{% url 'schedule:index' %}" class="btn btn-modern btn-outline-modern" style="border: 2px solid var(--primary); color: var(--primary);">
                            <i class="fas fa-home"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
