{% extends 'base_modern.html' %}

{% block title %}Edit Timetable - AI Class Scheduling System{% endblock %}

{% block content %}
<section class="hero-section" style="padding: 5rem 0 4rem;">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-lg-5">
                <div class="text-center">
                    <div class="feature-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2rem; background: var(--gradient-warm);">
                        <i class="fas fa-tools"></i>
                    </div>
                    <h2 class="fw-bold mb-3" style="letter-spacing: -0.02em;">Coming Soon</h2>
                    <p class="text-muted mb-4" style="font-size: 1.05rem;">
                        The timetable editing feature is currently under development. Check back soon for updates!
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="{% url 'schedule:admindash' %}" class="btn btn-modern btn-primary-modern" style="background: var(--gradient-ai); color: white;">
                            <i class="fas fa-tachometer-alt"></i> Back to Dashboard
                        </a>
                        <a href="{% url 'schedule:generate' %}" class="btn btn-modern btn-outline-modern" style="border: 2px solid var(--primary); color: var(--primary);">
                            <i class="fas fa-magic"></i> Generate New Timetable
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
